<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoBook — Original Calendar Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f5f3;color:#171717}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:0 auto;min-height:100vh;background:#fff}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid #e8e8e5;padding:14px 18px}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:12px;color:#777;margin-top:2px}.content{padding:18px;padding-bottom:104px}.hero{background:#f4f1ea;border-radius:22px;padding:22px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:27px;letter-spacing:-.8px}.hero p{margin:0;color:#626262;line-height:1.45}.card{border:1px solid #e8e8e5;border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#777}.small{font-size:13px}.secondary{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px}.month-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;margin:16px 0 10px}.month-head .secondary{padding:8px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;color:#888;font-size:11px;font-weight:700;padding:5px 0}.month-day{position:relative;min-height:68px;border:1px solid #e5e5e1;border-radius:10px;background:#fff;padding:8px;text-align:left}.month-day span{font-size:15px;font-weight:750}.month-day i{display:block;font-style:normal;font-size:9px;margin-top:7px}.month-day.working i{color:#171717}.month-day.off{background:#fafaf8;color:#999}.month-day.off i{color:#bbb}.month-day.other{opacity:.35}.month-day.selected{outline:2px solid #171717;outline-offset:-2px}.month-day em{position:absolute;right:6px;bottom:6px;font-style:normal;font-size:10px;background:#eee;border-radius:99px;padding:2px 5px}.calendar-legend{display:flex;justify-content:center;gap:18px;color:#777;font-size:12px;margin:10px 0 18px}.calendar-legend i{font-style:normal;color:#171717}@media(max-width:480px){.content{padding:15px;padding-bottom:104px}.month-day{min-height:56px;padding:7px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand">CoBook</div><div class="subtitle">Кабинет мастера</div></header>
<main class="content">
<div class="row"><div><h2>Календарь</h2><div class="muted">Нажмите на дату, чтобы сделать её рабочей или выходной.</div></div><button class="secondary">Журнал</button></div>
<div class="month-head"><button class="secondary">‹</button><b>август 2026 г.</b><button class="secondary">›</button></div>
<div class="month-grid" id="grid"></div>
<div class="calendar-legend"><span><i>●</i> рабочий день</span><span><i>—</i> выходной</span></div>
</main></div>
<script>
const grid=document.getElementById('grid');
['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(x=>{const e=document.createElement('div');e.className='weekday';e.textContent=x;grid.appendChild(e)});
// Exact monthCalendar() visual structure from commit 8e0421073a1e14b626370e4df2eac54e66d97763.
const year=2026,month=7,first=new Date(year,month,1,12),last=new Date(year,month+1,0,12),offset=(first.getDay()+6)%7,total=Math.ceil((offset+last.getDate())/7)*7;
for(let i=0;i<total;i++){
 const d=new Date(year,month,1+i-offset,12),date=d.getDate(),inside=d.getMonth()===month;
 const dow=d.getDay(),working=inside && !(dow===0||dow===3);
 const count=inside ? ({3:2,5:3,7:4,12:1,14:3,18:2,21:4,25:1,28:3}[date]||0) : 0;
 const b=document.createElement('button');b.className='month-day '+(!inside?'other ':'')+(working?'working':'off')+(date===23&&inside?' selected':'');b.innerHTML='<span>'+date+'</span><i>'+(working?'●':'—')+'</i>'+(count?'<em>'+count+'</em>':'');grid.appendChild(b)
}
</script>
</body></html>
