<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoBook — Calendar visual preview</title><style>body{margin:0;background:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717}.shell{max-width:760px;margin:auto;background:#fff;min-height:100vh;padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#777;font-size:13px}.month-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center;gap:8px;margin:14px 0}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#777;padding:7px 2px}.month-day{min-width:0;width:100%;aspect-ratio:1;border:1px solid #e5e5e2;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}.month-day span{font-size:16px}.month-day.working span{font-weight:800}.month-day.off span{font-weight:400;color:#777}.month-day:nth-child(7n) span,.month-day:nth-child(7n-1) span{color:#c33}.month-day i{font-style:normal;font-size:10px}.month-day em{position:absolute;right:5px;top:4px;font-size:9px;font-style:normal;color:#777}.month-day.other{opacity:.4}.legend{margin-top:14px;color:#777;font-size:13px}.secondary{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px}</style></head><body><div class="shell"><div class="row"><div><h2>Календарь</h2><div class="muted">Визуальный оригинал из главного Календаря</div></div></div><div class="month-head"><button class="secondary">‹</button><b>Август 2026</b><button class="secondary">›</button></div><div class="month-grid" id="grid"></div><div class="legend">● рабочий день &nbsp;&nbsp; — выходной</div></div><script>const g=document.getElementById('grid'),w=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];w.forEach(x=>{let e=document.createElement('div');e.className='weekday';e.textContent=x;g.append(e)});let off=5;for(let i=0;i<off;i++)g.append(document.createElement('div'));for(let d=1;d<=31;d++){let dow=(off+d-1)%7,working=!(dow===5||dow===6),e=document.createElement('button');e.className='month-day '+(working?'working':'off');e.innerHTML='<span>'+d+'</span><i>'+(working?'●':'—')+'</i>';g.append(e)}</script></body></html>
