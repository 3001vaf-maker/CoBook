<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoBook — Клиенты</title>
<style>
body{margin:0;background:#f5f5f3;color:#3b302b;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:700px;margin:auto;background:#fff;min-height:100vh;padding:18px;box-sizing:border-box}h1{margin:6px 0 18px}.muted{color:#7a6f69;font-size:12px}.list{display:grid;gap:10px}.row,.beige,button,input,select{font:inherit}.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid #e5ded9;border-radius:14px;background:#fff;text-align:left}.avatar{width:42px;height:42px;border-radius:12px;background:#f4f1ea;display:grid;place-items:center;font-weight:800}.row small{display:block;color:#7a6f69;font-size:12px;margin-top:3px}.card{margin-top:18px;border:1px solid #e5ded9;border-radius:20px;overflow:hidden}.head{padding:18px;background:#f4f1ea;display:flex;gap:14px;align-items:center}.section{padding:16px 18px;border-top:1px solid #e5ded9}.idbox{border:2px solid #3b302b;border-radius:16px;padding:14px}.id{font:800 25px ui-monospace,monospace;margin-top:5px}.action,.beige,.apply,.cancel,.mode{border:0;border-radius:13px;height:46px;font-weight:750}.action,.apply{background:#3b302b;color:#fff}.beige,.cancel,.mode{background:#f4f1ea;color:#3b302b}.action,.beige{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#faf9f7;border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:#7a6f69;margin:0 0 5px 2px}.field input,.field select{width:100%;height:44px;border:1px solid #e5ded9;border-radius:11px;padding:0 12px;box-sizing:border-box;background:#fff}.suffix{position:relative}.suffix span{position:absolute;right:12px;top:29px;color:#7a6f69}.suffix input{padding-right:32px}.contactField{position:relative}.contactBox{display:flex;gap:6px}.contactBox input{flex:1;min-width:0}.contactMenu{width:44px;height:44px;border:1px solid #e5ded9;border-radius:11px;background:#f4f1ea;font-weight:800}.contactList{margin-top:6px;border:1px solid #e5ded9;border-radius:11px;background:#fff;overflow:hidden}.contactOption{width:100%;height:auto;padding:10px 12px;border:0;border-bottom:1px solid #e5ded9;background:#fff;text-align:left}.contactOption:last-child{border-bottom:0}.contactOption.selected{background:#f4f1ea;font-weight:750}.addContact{width:100%;height:42px;border:0;background:#faf9f7;text-align:left;padding:0 12px;font-weight:700}.programBtn{width:100%;height:48px;border:0;border-radius:13px;background:#f4f1ea;color:#3b302b;font-weight:800;text-align:left;padding:0 14px;display:flex;justify-content:space-between;align-items:center}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;padding:14px;z-index:20}.modalbox{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:520px;margin:auto}.modaltitle{font-size:20px;font-weight:800;margin:0 0 14px}.modes,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{height:52px}.input{width:100%;height:48px;border:1px solid #e5ded9;border-radius:12px;padding:0 12px;box-sizing:border-box;font:18px ui-monospace,monospace}.preview{text-align:center;font:800 26px ui-monospace,monospace;padding:10px}.error{background:#f6e7e4;padding:9px;border-radius:10px;margin-top:8px}.existing{margin-top:10px;border:1px solid #e5ded9;border-radius:12px;max-height:240px;overflow:auto}.existing div{padding:11px;border-bottom:1px solid #e5ded9;display:flex;justify-content:space-between;align-items:center}.existing div:last-child{border:0}.existing button{border:0;border-radius:8px;background:#f4f1ea;padding:8px}.hidden{display:none!important}@media(max-width:480px){.stats,.modes,.actions,.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><div class="muted">УПРАВЛЕНИЕ</div><h1>Клиенты</h1><div id="list" class="list"></div>
<div id="profile" class="card hidden"><div class="head"><div id="avatar" class="avatar"></div><div><strong id="name"></strong><span id="status" class="muted"></span></div></div>
<div id="idSection" class="section"><b>Client ID</b><div class="idbox"><div id="clientId" class="id">—</div><span id="idState" class="muted"></span><button id="idAction" class="action">Присвоить ID</button></div></div>
<div class="section"><b>Контакты</b><div id="contacts" class="muted"></div></div>
<div class="section"><b>Показатели</b><div class="stats"><div class="stat"><b id="visits">—</b><span class="muted">посещений</span></div><div class="stat"><b id="total">—</b><span class="muted">сумма</span></div><div class="stat"><b id="last">—</b><span class="muted">последний визит</span></div></div></div>
<div class="section"><b>Важная программа</b><button id="account" class="programBtn"><span id="program">Не назначена</span><span>›</span></button></div>
<button id="edit" class="beige">Редактировать данные</button>
<div id="editPanel" class="section hidden"><b>Личные данные</b><div class="grid"><div class="field"><label>Имя</label><input id="editName"></div><div class="field"><label>Фамилия</label><input id="editSurname"></div><div class="field"><label>Пол</label><select id="editGender"><option value="">Не выбран</option><option>Женский</option><option>Мужской</option></select></div><div class="field"><label>День рождения</label><input id="editBirth" placeholder="ДД.ММ.ГГГГ"></div></div>
<div style="height:14px"></div><b>Контактные данные</b>
<div class="grid"><div class="field contactField"><label>Телефон</label><div class="contactBox"><input id="editPhone"><button class="contactMenu" data-menu="phones">⌄</button></div><div id="phonesMenu" class="contactList hidden"></div></div>
<div class="field contactField"><label>Email</label><div class="contactBox"><input id="editEmail"><button class="contactMenu" data-menu="emails">⌄</button></div><div id="emailsMenu" class="contactList hidden"></div></div>
<div class="field contactField"><label>Telegram</label><div class="contactBox"><input id="editTg"><button class="contactMenu" data-menu="tgs">⌄</button></div><div id="tgsMenu" class="contactList hidden"></div></div></div>
<div style="height:14px"></div><b>Дополнительные данные мастера</b><div class="grid"><div class="field suffix"><label>Скидка</label><input id="editDiscount" inputmode="decimal" type="number" min="0" step="0.01"><span>%</span></div><div class="field"><label>От кого узнал про мастера</label><input id="editSource"></div></div>
<div class="actions" style="margin-top:12px"><button id="saveEdit" class="apply">Сохранить</button><button id="cancelEdit" class="cancel">Отмена</button></div></div></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><h2 id="title" class="modaltitle">Client ID</h2><div id="choice" class="modes"><button id="assign" class="mode">Присвоить ID</button><button id="link" class="mode">Привязать к ID</button></div><div id="assignView" class="hidden"><input id="idInput" class="input" inputmode="numeric" maxlength="4" placeholder="1–9999"><div id="preview" class="preview">—</div><div id="error" class="error hidden"></div><div class="actions"><button id="apply" class="apply">Применить</button><button id="cancel1" class="cancel">Отмена</button></div></div><div id="linkView" class="hidden"><input id="search" class="input" inputmode="numeric" maxlength="4" placeholder="Быстрый поиск по ID"><div id="existing" class="existing"></div><div class="actions"><button id="cancel2" class="cancel">Отмена</button></div></div></div></div>
<div id="accountModal" class="modal hidden"><div class="modalbox"><h2 class="modaltitle">Личный счёт</h2><div class="section" style="border:1px solid #e5ded9;border-radius:14px"><span class="muted">Баланс</span><strong id="accountBalance" style="font-size:24px;display:block;margin-top:5px">—</strong></div><button id="closeAccount" class="cancel" style="width:100%;margin-top:12px">Закрыть</button></div></div>
<script>
var profiles=[
{id:1,name:'Алексей',surname:'К.',phones:['+7 900 000-00-00'],phonePrimary:0,emails:['alex@example.ru'],emailPrimary:0,tgs:['@example'],tgPrimary:0,birth:'12.03.1985',gender:'Мужской',discount:'10',source:'Рекомендация',clientId:'0007',visits:'24',total:'96 000 ₽',last:'20.08',program:'Личный счёт',balance:'7 500 ₽'},
{id:2,name:'Мария',surname:'С.',phones:['+7 901 000-00-00'],phonePrimary:0,emails:[],emailPrimary:0,tgs:['@maria'],tgPrimary:0,birth:'',gender:'Женский',discount:'',source:'',clientId:'0012'},
{id:3,name:'Людмила',surname:'П.',phones:['+7 902 000-00-00'],phonePrimary:0,emails:[],emailPrimary:0,tgs:[],tgPrimary:0,birth:'',gender:'',discount:'',source:'',clientId:''},
{id:4,name:'Елена',surname:'В.',phones:[],phonePrimary:0,emails:[],emailPrimary:0,tgs:['@elena'],tgPrimary:0,birth:'',gender:'Женский',discount:'5',source:'',clientId:'0042'}
];
var current=null,used={'0007':1,'0012':1,'0042':1};
function el(id){return document.getElementById(id)}function fullName(p){return[p.name,p.surname].filter(Boolean).join(' ')}function arr(p,k){return Array.isArray(p[k])?p[k]:[]}function primary(p,k,idx){var a=arr(p,k);return a[p[idx]||0]||''}
function renderList(){var html='';profiles.forEach(function(p){html+='<button class="row" data-id="'+p.id+'"><span class="avatar">'+(p.name?p.name.charAt(0):'?')+'</span><span><strong>'+fullName(p)+'</strong><small>'+(p.clientId?'Client ID · '+p.clientId:'Профиль без Client ID')+' · '+(primary(p,'phones','phonePrimary')||primary(p,'tgs','tgPrimary')||'')+'</small></span></button>'});html+='<button id="newClient" class="beige">+ Добавить клиента</button>';el('list').innerHTML=html;el('newClient').onclick=function(){var p={id:Date.now(),name:'',surname:'',phones:[],phonePrimary:0,emails:[],emailPrimary:0,tgs:[],tgPrimary:0,birth:'',gender:'',discount:'',source:'',clientId:''};profiles.push(p);openProfile(p);el('editPanel').classList.remove('hidden')}}
function fillEdit(){var p=current;el('editName').value=p.name||'';el('editSurname').value=p.surname||'';el('editPhone').value=primary(p,'phones','phonePrimary');el('editEmail').value=primary(p,'emails','emailPrimary');el('editTg').value=primary(p,'tgs','tgPrimary');el('editBirth').value=p.birth||'';el('editGender').value=p.gender||'';el('editDiscount').value=p.discount||'';el('editSource').value=p.source||'';drawMenu('phones');drawMenu('emails');drawMenu('tgs')}
function drawMenu(type){var key=type==='phones'?'phones':type==='emails'?'emails':'tgs',pi=type==='phones'?'phonePrimary':type==='emails'?'emailPrimary':'tgPrimary',a=arr(current,key),box=el(type+'Menu');var html=a.map(function(v,i){return'<button class="contactOption '+(i===current[pi]?'selected':'')+'" data-contact="'+type+'" data-index="'+i+'">'+v+(i===current[pi]?' · отображается':'')+'</button>'}).join('');html+='<button class="addContact" data-add="'+type+'">+ Добавить</button>';box.innerHTML=html}
function saveField(type){var input=type==='phones'?'editPhone':type==='emails'?'editEmail':'editTg',key=type,pi=type==='phones'?'phonePrimary':type==='emails'?'emailPrimary':'tgPrimary',v=el(input).value.trim();if(!v)return;var a=arr(current,key),idx=current[pi];if(a.length===0){a.push(v);current[pi]=0}else if(a[idx]!==v){if(a.indexOf(v)<0)a.push(v);current[pi]=a.indexOf(v)}current[key]=a;drawMenu(type);render(current)}
function openProfile(p){el('list').classList.add('hidden');el('profile').classList.remove('hidden');render(p)}
function render(p){current=p;el('name').textContent=fullName(p)||'Новый профиль';el('avatar').textContent=p.name?p.name.charAt(0):'?';el('status').textContent=p.clientId?'Клиент · Client ID '+p.clientId:'Профиль · Client ID не присвоен';el('idSection').classList.toggle('hidden',!!p.clientId);el('clientId').textContent=p.clientId||'—';el('idState').textContent=p.clientId?'Профиль связан с клиентской сущностью.':'Профиль ещё не связан с клиентской сущностью.';el('contacts').textContent=[primary(p,'phones','phonePrimary'),primary(p,'emails','emailPrimary'),primary(p,'tgs','tgPrimary')].filter(Boolean).join(' · ')||'—';el('visits').textContent=p.visits||'—';el('total').textContent=p.total||'—';el('last').textContent=p.last||'—';el('program').textContent=p.program||'Не назначена';el('accountBalance').textContent=p.balance||'0 ₽';fillEdit()}
function closeModal(){el('modal').classList.add('hidden');el('choice').classList.remove('hidden');el('assignView').classList.add('hidden');el('linkView').classList.add('hidden');el('idInput').value='';el('search').value='';el('error').classList.add('hidden');el('preview').textContent='—'}
function closeAccount(){el('accountModal').classList.add('hidden')}
renderList();el('list').onclick=function(e){var r=e.target.closest('.row');if(!r)return;var p=profiles.find(function(x){return String(x.id)===r.dataset.id});if(p)openProfile(p)};
el('edit').onclick=function(){fillEdit();el('editPanel').classList.remove('hidden')};el('cancelEdit').onclick=function(){el('editPanel').classList.add('hidden');fillEdit()};
el('saveEdit').onclick=function(){var p=current;p.name=el('editName').value.trim();p.surname=el('editSurname').value.trim();saveField('phones');saveField('emails');saveField('tgs');p.birth=el('editBirth').value.trim();p.gender=el('editGender').value;p.discount=el('editDiscount').value.trim();p.source=el('editSource').value.trim();el('editPanel').classList.add('hidden');render(p);renderList()};
['phones','emails','tgs'].forEach(function(type){var input=type==='phones'?'editPhone':type==='emails'?'editEmail':'editTg';el(input).addEventListener('change',function(){saveField(type)});el(input).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveField(type)}});el(type+'Menu').onclick=function(e){var opt=e.target.closest('[data-index]');if(opt){var pi=type==='phones'?'phonePrimary':type==='emails'?'emailPrimary':'tgPrimary';current[pi]=Number(opt.dataset.index);el(type==='phones'?'editPhone':type==='emails'?'editEmail':'editTg').value=arr(current,type)[current[pi]]||'';drawMenu(type);render(current);return}var add=e.target.closest('[data-add]');if(add){var inp=type==='phones'?'editPhone':type==='emails'?'editEmail':'editTg';el(inp).value='';el(inp).focus()}}});
document.querySelectorAll('.contactMenu').forEach(function(b){b.onclick=function(){var t=b.dataset.menu;el(t+'Menu').classList.toggle('hidden');drawMenu(t)}});
el('account').onclick=function(){el('accountBalance').textContent=current.balance||'0 ₽';el('accountModal').classList.remove('hidden')};el('closeAccount').onclick=closeAccount;
el('idAction').onclick=function(){if(!current.clientId)el('modal').classList.remove('hidden')};el('assign').onclick=function(){el('choice').classList.add('hidden');el('assignView').classList.remove('hidden');el('title').textContent='Присвоить Client ID';el('idInput').focus()};
el('idInput').oninput=function(){var v=this.value.replace(/\D/g,'');this.value=v;el('preview').textContent=v?String(Number(v)).padStart(4,'0'):'—';el('error').classList.add('hidden')};
el('apply').onclick=function(){var n=Number(el('idInput').value);if(!Number.isInteger(n)||n<1||n>9999){el('error').textContent='Введите число от 1 до 9999.';el('error').classList.remove('hidden');return}var id=String(n).padStart(4,'0');if(used[id]){el('error').textContent='Этот Client ID уже занят. Сохранить нельзя.';el('error').classList.remove('hidden');return}used[id]=1;current.clientId=id;closeModal();render(current);renderList()};el('cancel1').onclick=closeModal;
el('link').onclick=function(){el('choice').classList.add('hidden');el('linkView').classList.remove('hidden');el('title').textContent='Привязать к Client ID';renderExisting('');el('search').focus()};function renderExisting(q){var html='';profiles.forEach(function(p){if(p.clientId&&(!q||p.clientId.indexOf(q)>=0))html+='<div><span>'+p.clientId+' · '+fullName(p)+'</span><button data-link="'+p.clientId+'">Выбрать</button></div>'});el('existing').innerHTML=html||'<div>Ничего не найдено</div>'}el('search').oninput=function(){this.value=this.value.replace(/\D/g,'');renderExisting(this.value)};el('existing').onclick=function(e){var b=e.target.closest('[data-link]');if(!b)return;current.clientId=b.dataset.link;closeModal();render(current);renderList()};el('cancel2').onclick=closeModal;
</script></body></html>
