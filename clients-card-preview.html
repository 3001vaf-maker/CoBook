<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoBook — Клиенты</title><style>body{margin:0;background:#f5f5f3;color:#3b302b;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:700px;margin:auto;background:white;min-height:100vh;padding:18px;box-sizing:border-box}h1{margin:6px 0 18px}.list{display:grid;gap:10px}.row,button,input{font:inherit}.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid #e5ded9;border-radius:14px;background:white;text-align:left}.avatar{width:42px;height:42px;border-radius:12px;background:#f4f1ea;display:grid;place-items:center;font-weight:800}.row small,.muted{display:block;color:#7a6f69;font-size:12px;margin-top:3px}.card{margin-top:18px;border:1px solid #e5ded9;border-radius:20px;overflow:hidden}.head{padding:18px;background:#f4f1ea;display:flex;gap:14px;align-items:center}.section{padding:16px 18px;border-top:1px solid #e5ded9}.idbox{border:2px solid #3b302b;border-radius:16px;padding:14px}.id{font:800 25px ui-monospace,monospace;margin-top:5px}.action,.beige,.back,.apply,.cancel,.mode{border:0;border-radius:13px;height:46px;font-weight:750}.action,.apply,.back{background:#3b302b;color:white}.beige,.cancel,.mode{background:#f4f1ea;color:#3b302b}.action,.beige,.back{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#faf9f7;border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;padding:14px}.modalbox{background:white;border-radius:22px;padding:20px;width:100%;max-width:520px;margin:auto}.modes,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{height:52px}.input{width:100%;height:48px;border:1px solid #e5ded9;border-radius:12px;padding:0 12px;box-sizing:border-box;font:18px ui-monospace,monospace}.preview{text-align:center;font:800 26px ui-monospace,monospace;padding:10px}.error{background:#f6e7e4;padding:9px;border-radius:10px;margin-top:8px}.existing{margin-top:10px;border:1px solid #e5ded9;border-radius:12px;max-height:240px;overflow:auto}.existing div{padding:11px;border-bottom:1px solid #e5ded9;display:flex;justify-content:space-between;align-items:center}.existing button{border:0;border-radius:8px;background:#f4f1ea;padding:8px}.hidden{display:none!important}@media(max-width:480px){.stats,.modes,.actions{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="muted">УПРАВЛЕНИЕ</div><h1>Клиенты</h1><div id="list" class="list"></div><div id="profile" class="card hidden"><div class="head"><div id="avatar" class="avatar"></div><div><strong id="name"></strong><span id="status" class="muted"></span></div></div><div id="idSection" class="section"><b>Client ID</b><div class="idbox"><div id="clientId" class="id">—</div><span id="idState" class="muted"></span><button id="idAction" class="action">Присвоить ID</button></div></div><div class="section"><b>Контакты</b><div id="contacts" class="muted"></div></div><div class="section"><b>Показатели</b><div class="stats"><div class="stat"><b id="visits">—</b><span class="muted">посещений</span></div><div class="stat"><b id="total">—</b><span class="muted">сумма</span></div><div class="stat"><b id="last">—</b><span class="muted">последний визит</span></div></div></div><div class="section"><b>Важная программа</b><div id="program" class="muted"></div></div><button id="back" class="back">Назад</button></div></div><div id="modal" class="modal hidden"><div class="modalbox"><h2 id="title">Client ID</h2><div id="choice" class="modes"><button id="assign" class="mode">Присвоить ID</button><button id="link" class="mode">Привязать к ID</button></div><div id="assignView" class="hidden"><input id="idInput" class="input" inputmode="numeric" maxlength="4" placeholder="1–9999"><div id="preview" class="preview">—</div><div id="error" class="error hidden"></div><div class="actions"><button id="apply" class="apply">Применить</button><button id="cancel1" class="cancel">Назад</button></div></div><div id="linkView" class="hidden"><input id="search" class="input" inputmode="numeric" maxlength="4" placeholder="Быстрый поиск по ID"><div id="existing" class="existing"></div><div class="actions"><button id="cancel2" class="cancel">Назад</button></div></div></div></div><script>var profiles=[{id:1,name:'Алексей К.',phone:'+7 900 000-00-00',clientId:'0007',visits:'24',total:'96 000 ₽',last:'20.08',program:'Личный счёт',balance:'7 500 ₽'},{id:2,name:'Мария С.',phone:'+7 901 000-00-00',clientId:'0012'},{id:3,name:'Людмила П.',phone:'+7 902 000-00-00',clientId:''},{id:4,name:'Елена В.',phone:'@elena',clientId:'0042'}];var current=null;var used={"0007":1,"0012":1,"0042":1};function el(id){return document.getElementById(id)}function showList(){el('list').classList.remove('hidden');el('profile').classList.add('hidden');closeModal();renderList()}function renderList(){var html='';for(var i=0;i<profiles.length;i++){var p=profiles[i];html+='<button class="row" data-id="'+p.id+'"><span class="avatar">'+p.name.charAt(0)+'</span><span><strong>'+p.name+'</strong><small>'+(p.clientId?'Client ID · '+p.clientId:'Профиль без Client ID')+' · '+(p.phone||'')+'</small></span></button>'}html+='<button id="newClient" class="beige">+ Добавить клиента</button>';el('list').innerHTML=html;el('newClient').onclick=function(){var p={id:Date.now(),name:'Новый профиль',phone:'',clientId:''};profiles.push(p);openProfile(p)}}function openProfile(p){current=p;el('list').classList.add('hidden');el('profile').classList.remove('hidden');el('name').textContent=p.name;el('avatar').textContent=p.name.charAt(0);el('status').textContent=p.clientId?'Клиент · Client ID '+p.clientId:'Профиль · Client ID не присвоен';el('idSection').classList.toggle('hidden',!!p.clientId);el('clientId').textContent=p.clientId||'—';el('idState').textContent=p.clientId?'Профиль связан с клиентской сущностью.':'Профиль ещё не связан с клиентской сущностью.';el('idAction').textContent='Присвоить ID';el('contacts').textContent=p.phone||'—';el('visits').textContent=p.visits||'—';el('total').textContent=p.total||'—';el('last').textContent=p.last||'—';el('program').textContent=p.program?(p.program+(p.balance?' · '+p.balance:'')):'Не назначена'}el('list').onclick=function(e){var r=e.target.closest('.row');if(!r)return;for(var i=0;i<profiles.length;i++)if(String(profiles[i].id)===r.dataset.id)openProfile(profiles[i])};function closeModal(){el('modal').classList.add('hidden');el('choice').classList.remove('hidden');el('assignView').classList.add('hidden');el('linkView').classList.add('hidden');el('idInput').value='';el('search').value='';el('error').classList.add('hidden');el('preview').textContent='—'}el('idAction').onclick=function(){if(!current.clientId)el('modal').classList.remove('hidden')};el('assign').onclick=function(){el('choice').classList.add('hidden');el('assignView').classList.remove('hidden');el('title').textContent='Присвоить Client ID';el('idInput').focus()};el('idInput').oninput=function(){var v=this.value.replace(/\D/g,'');this.value=v;el('preview').textContent=v?String(Number(v)).padStart(4,'0'):'—';el('error').classList.add('hidden')};el('apply').onclick=function(){var n=Number(el('idInput').value);if(!Number.isInteger(n)||n<1||n>9999){el('error').textContent='Введите число от 1 до 9999.';el('error').classList.remove('hidden');return}var id=String(n).padStart(4,'0');if(used[id]){el('error').textContent='Этот Client ID уже занят. Сохранить нельзя.';el('error').classList.remove('hidden');return}used[id]=1;current.clientId=id;closeModal();openProfile(current)};el('cancel1').onclick=closeModal;el('link').onclick=function(){el('choice').classList.add('hidden');el('linkView').classList.remove('hidden');el('title').textContent='Привязать к Client ID';renderExisting('');el('search').focus()};function renderExisting(q){var html='';for(var i=0;i<profiles.length;i++){var p=profiles[i];if(p.clientId&&(!q||p.clientId.indexOf(q)>=0))html+='<div><span>'+p.clientId+' · '+p.name+'</span><button data-link="'+p.clientId+'">Выбрать</button></div>'}el('existing').innerHTML=html||'<div>Ничего не найдено</div>'}el('search').oninput=function(){this.value=this.value.replace(/\D/g,'');renderExisting(this.value)};el('existing').onclick=function(e){var b=e.target.closest('[data-link]');if(!b)return;current.clientId=b.dataset.link;closeModal();openProfile(current)};el('cancel2').onclick=closeModal;el('back').onclick=showList;renderList();</script></body></html>
