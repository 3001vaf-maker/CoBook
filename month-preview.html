<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoBook — Журнал → Месяц</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f5f3;color:#171717}button{font:inherit;cursor:pointer}.shell{max-width:760px;margin:0 auto;min-height:100vh;background:#fff;padding:18px 18px 40px}.journal-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.journal-tab{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px;color:#777}.journal-tab.active{background:#171717;color:#fff;font-weight:750}.journal-month-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center;gap:8px;margin:12px 0}.journal-month-head b{text-transform:capitalize;font-size:17px}.secondary{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px}.journal-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;align-items:stretch}.journal-month-weekday{min-width:0;text-align:center;font-size:12px;font-weight:700;color:#777;padding:7px 2px}.journal-month-weekday.weekend{color:#c33}.journal-month-cell{min-width:0!important;width:100%;aspect-ratio:1/1;border:1px solid #e5e5e2;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;position:relative}.journal-month-cell .num{font-size:16px;line-height:1;font-weight:400;color:#777}.journal-month-cell.working .num{font-weight:800;color:#111}.journal-month-cell.off .num{font-weight:400;color:#777}.journal-month-cell.weekend .num{color:#c33}.journal-month-cell .indicator{width:10px;height:10px;border-radius:2px;border:1px solid #d5d5d1;background:#f3f3f1;overflow:hidden;position:relative}.journal-month-cell .indicator:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:var(--fill,0%);background:#63b66a;border-radius:1px}.journal-month-cell.has-booking .indicator{border-color:#8ab88e}.journal-month-cell.selected{outline:2px solid #171717;outline-offset:-2px}.journal-month-cell.other{opacity:.42}@media(max-width:480px){.shell{padding:15px}.journal-month-grid{gap:5px}.journal-month-cell{border-radius:10px}.journal-month-cell .num{font-size:15px}}
</style>
</head>
<body>
<div class="shell">
  <div class="journal-tabs">
    <button class="journal-tab">День</button>
    <button class="journal-tab active">Месяц</button>
    <button class="journal-tab">Список</button>
  </div>
  <div class="journal-month-head">
    <button class="secondary">‹</button>
    <b>Август 2026</b>
    <button class="secondary">›</button>
  </div>
  <div class="journal-month-grid" id="grid"></div>
</div>
<script>
const weekdays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const grid=document.getElementById('grid');
weekdays.forEach((name,i)=>{const el=document.createElement('div');el.className='journal-month-weekday'+(i>4?' weekend':'');el.textContent=name;grid.appendChild(el)});
// Static visual test data only. This page is not connected to CoBook data or the working UI.
const daysInMonth=31,firstOffset=5;
for(let i=0;i<firstOffset;i++)grid.appendChild(document.createElement('div'));
const loads={3:25,5:50,7:75,11:100,14:25,18:50,21:75,25:100,28:50};
for(let d=1;d<=daysInMonth;d++){
 const dow=(firstOffset+d-1)%7;
 const working=!(dow===5||dow===6);
 const load=working?(loads[d]||0):0;
 const cell=document.createElement('button');
 cell.className='journal-month-cell '+(working?'working':'off')+(load?' has-booking':'')+((dow===5||dow===6)?' weekend':'')+(d===23?' selected':'');
 cell.style.setProperty('--fill',load+'%');
 cell.innerHTML='<span class="num">'+d+'</span><span class="indicator" aria-label="Загрузка '+load+'%"></span>';
 grid.appendChild(cell);
}
</script>
</body>
</html>
