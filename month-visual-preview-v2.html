<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoBook — Журнал → Месяц — visual preview v6</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f5f3;color:#171717}button{font:inherit;cursor:pointer}.shell{max-width:760px;margin:0 auto;min-height:100vh;background:#fff}.topbar{padding:14px 18px;border-bottom:1px solid #e8e8e5}.brand{font-size:22px;font-weight:800}.subtitle{font-size:12px;color:#777;margin-top:2px}.content{padding:18px 18px 40px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#777}.secondary{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px}.month-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;margin:16px 0 10px}.month-head .secondary{padding:8px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;color:#888;font-size:11px;font-weight:700;padding:5px 0}.weekday.weekend{color:#c33}.month-day{position:relative;min-height:68px;border:1px solid #e5e5e1;border-radius:10px;background:#fff;padding:8px;text-align:left;overflow:hidden}.month-day:before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--load,0%);background:#bfe8f4;z-index:0}.month-day>*{position:relative;z-index:1}.month-day span{font-size:19px;font-weight:800;color:#777}.month-day.off span,.month-day.weekend span{font-size:13px;font-weight:400;color:#999}.month-day.weekend span{color:#c33}.month-day.other{background:#f4f4f2}.month-day.other span{font-size:13px;font-weight:400;color:#aaa}.month-day.other.weekend span{color:#c99}.month-day.selected{outline:2px solid #171717;outline-offset:-2px}.month-day em{position:absolute;right:6px;bottom:6px;font-style:normal;font-size:10px;background:rgba(255,255,255,.82);border-radius:99px;padding:2px 5px;color:#666}.month-day.full:before{background:#8fd4e8}.month-day.zero:before{height:0}.legend{color:#777;font-size:12px;margin:10px 0 18px}@media(max-width:480px){.content{padding:15px}.month-day{min-height:56px;padding:7px}}</style></head><body><div class="shell"><header class="topbar"><div class="brand">CoBook</div><div class="subtitle">Кабинет мастера</div></header><main class="content"><div class="row"><div><h2>Месяц</h2><div class="muted">Просмотр загрузки месяца</div></div><button class="secondary">Журнал</button></div><div class="month-head"><button class="secondary">‹</button><b>август 2026 г.</b><button class="secondary">›</button></div><div class="month-grid" id="grid"></div><div class="legend">Заполнение ячейки показывает процент занятости дня. Число в ячейке — количество записей.</div></main></div><script>const grid=document.getElementById('grid'),week=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];week.forEach((x,i)=>{const e=document.createElement('div');e.className='weekday'+(i>4?' weekend':'');e.textContent=x;grid.append(e)});const firstOffset=5,lastDay=31,data={3:[25,2],5:[50,3],7:[75,4],11:[100,5],14:[25,1],18:[50,2],21:[75,3],25:[100,4],28:[50,2]};function addDay(d,other,dow,load=0,count=0){const weekend=dow>4,working=!weekend,e=document.createElement('button');e.className='month-day '+(working?'working':'off')+(weekend?' weekend':'')+(other?' other':'')+(load===100?' full':'')+(load===0?' zero':'');e.style.setProperty('--load',load+'%');e.innerHTML='<span>'+d+'</span>'+(count?'<em>'+count+'</em>':'');grid.append(e)}for(let i=0;i<firstOffset;i++){const d=31-firstOffset+i+1;const dow=i;addDay(d,true,dow)}for(let d=1;d<=31;d++){const dow=(firstOffset+d-1)%7,item=data[d]||[0,0];addDay(d,false,dow,item[0],item[1])}const cells=firstOffset+lastDay;const nextDays=7-(cells%7);for(let i=1;i<=nextDays;i++){const dow=(cells+i-1)%7;addDay(i,true,dow)}</script></body></html>
